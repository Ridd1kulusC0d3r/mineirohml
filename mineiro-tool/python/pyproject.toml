[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mineiro-osint"
version = "1.7.0"
description = "Mineiro: OSINT workbench for public username presence, evidence-first. Installs the full web app; run it with `mineiro`."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mineiro OSINT Extractor contributors" }]
keywords = ["osint", "username", "threat-intelligence", "investigation", "cybersecurity", "stix", "dfir"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
# The app is Node.js. A system Node >= 22 is used when present; otherwise this wheel provides one.
dependencies = ["nodejs-wheel-binaries>=22"]

[project.scripts]
mineiro = "mineiro_osint.cli:main"

[project.urls]
Homepage = "https://github.com/Ridd1kulusC0d3r/Mineiro-OSINT-Extractor"
Issues = "https://github.com/Ridd1kulusC0d3r/Mineiro-OSINT-Extractor/issues"
Changelog = "https://github.com/Ridd1kulusC0d3r/Mineiro-OSINT-Extractor/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mineiro_osint = ["_app/**/*"]
