name: Bug report
description: Relate um problema reproduzível no Mineiro
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o Mineiro. Não publique tokens, cookies, credenciais ou dados pessoais.
  - type: input
    id: version
    attributes:
      label: Versão
      placeholder: "1.4.2"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Ambiente
      options:
        - Google Colab
        - Linux
        - macOS
        - Windows
        - Outro
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js
      placeholder: "v22.x"
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Passos mínimos para reproduzir
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Confirmações
      options:
        - label: Removi dados pessoais, tokens, cookies e credenciais.
          required: true
        - label: Verifiquei a documentação de troubleshooting.
          required: true
