version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    ignore:
      # Runtime is Node 22 LTS; keep the type definitions aligned with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # vite and its plugins declare peer ranges on each other and must move together.
      vite-toolchain:
        patterns: ["vite", "@vitejs/*", "@tailwindcss/vite"]
