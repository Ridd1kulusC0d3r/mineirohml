name: Detector health

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Run canaries
        id: canaries
        run: npx tsx scripts/detector-health.ts
        continue-on-error: true
      - name: Open or update drift issue
        if: steps.canaries.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('detector-health.md', 'utf8');
            const title = 'Detector drift detected';
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'detector-drift' });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['detector-drift'] });
            }
      - name: Fail job on drift
        if: steps.canaries.outcome == 'failure'
        run: exit 1
