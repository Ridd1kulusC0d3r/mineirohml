[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mineiro"
version = "2.0.0a1"
description = "Mineiro: OSINT username investigation workbench in Python (evidence first, cautious correlation, auditable reports)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
notebook = ["ipywidgets>=8"]
web = ["starlette>=0.37", "uvicorn>=0.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "starlette>=0.37", "uvicorn>=0.30"]

[project.scripts]
mineiro = "mineiro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mineiro = ["data/*.json", "web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
